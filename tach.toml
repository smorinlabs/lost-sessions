# tach.toml — bounded-context isolation (HEX-31).
#
# One real capability today (projects, under core/), so this mostly restates
# the cli/web/core boundaries import-linter already guards; its value grows
# with a second bounded context, where per-context isolation + strict public
# interfaces (deny-internals-by-default) become the thing import-linter cannot
# express. Run via `uv run tach check` (wired into `just check`).
source_roots = ["src"]
exclude = [
  "tests",
  "init",
  "docs",
  "scripts",
  "build",
  "dist",
  ".venv",
]

[[modules]]
path = "lost_sessions"
depends_on = []

[[modules]]
path = "lost_sessions.core"
depends_on = ["lost_sessions"]

[[modules]]
path = "lost_sessions.composition"
depends_on = ["lost_sessions.core"]

[[modules]]
path = "lost_sessions.cli"
depends_on = ["lost_sessions.composition", "lost_sessions.core", "lost_sessions"]

[[modules]]
path = "lost_sessions.web"
depends_on = ["lost_sessions.core", "lost_sessions.composition", "lost_sessions"]
